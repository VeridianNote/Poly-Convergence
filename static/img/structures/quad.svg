<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="glow-q" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer square connections -->
  <line x1="40" y1="40" x2="160" y2="40" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="160" y1="40" x2="160" y2="160" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="160" y1="160" x2="40" y2="160" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="40" y1="160" x2="40" y2="40" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- diagonal connections (full quad) -->
  <line x1="40" y1="40" x2="160" y2="160" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="160" y1="40" x2="40" y2="160" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <!-- glow -->
  <circle cx="40" cy="40" r="24" fill="url(#glow-q)"/>
  <circle cx="160" cy="40" r="24" fill="url(#glow-q)"/>
  <circle cx="160" cy="160" r="24" fill="url(#glow-q)"/>
  <circle cx="40" cy="160" r="24" fill="url(#glow-q)"/>
  <!-- nodes -->
  <circle cx="40" cy="40" r="10" fill="#818cf8" fill-opacity="0.8"/>
  <circle cx="160" cy="40" r="10" fill="#818cf8" fill-opacity="0.8"/>
  <circle cx="160" cy="160" r="10" fill="#818cf8" fill-opacity="0.8"/>
  <circle cx="40" cy="160" r="10" fill="#818cf8" fill-opacity="0.8"/>
  <!-- labels -->
  <text x="22" y="26" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">A</text>
  <text x="178" y="26" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">B</text>
  <text x="178" y="184" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">C</text>
  <text x="22" y="184" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">D</text>
</svg>