<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <defs>
    <!-- arrowhead -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
    </marker>
  </defs>

  <!-- dark background so it reads in both light and dark mode -->
  <rect x="0" y="0" width="800" height="650" rx="12" ry="12" fill="#1a1a2e"/>

  <!-- axes -->
  <line x1="100" y1="560" x2="740" y2="560" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.45" marker-end="url(#arrow)"/>
  <line x1="100" y1="560" x2="100" y2="50" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.45" marker-end="url(#arrow)"/>

  <!-- axis labels -->
  <text x="420" y="620" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill-opacity="0.85">EXCLUSIVITY</text>
  <text x="420" y="600" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" fill-opacity="0.5">Closed ← → Open</text>

  <text x="36" y="305" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill-opacity="0.85" transform="rotate(-90, 36, 305)">ENTANGLEMENT</text>
  <text x="62" y="305" text-anchor="middle" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" fill-opacity="0.5" transform="rotate(-90, 62, 305)">Independent ← → Intertwined</text>

  <!-- quadrant dividers (very subtle) -->
  <line x1="420" y1="70" x2="420" y2="555" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.1"/>
  <line x1="105" y1="310" x2="735" y2="310" stroke="#818cf8" stroke-width="0.5" stroke-opacity="0.1"/>

  <!-- =========================== -->
  <!-- Items — only things the page covers -->
  <!-- =========================== -->

  <!-- Monogamy: closed + very intertwined (reference point) -->
  <ellipse cx="195" cy="140" rx="60" ry="42" fill="#818cf8" fill-opacity="0.14"/>
  <ellipse cx="195" cy="140" rx="38" ry="26" fill="#818cf8" fill-opacity="0.12"/>
  <text x="195" y="144" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Monogamy</text>

  <!-- Polyfidelity: closed + intertwined, near monogamy -->
  <ellipse cx="310" cy="170" rx="62" ry="40" fill="#818cf8" fill-opacity="0.14"/>
  <ellipse cx="310" cy="170" rx="40" ry="25" fill="#818cf8" fill-opacity="0.12"/>
  <text x="310" y="164" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Polyfidelity</text>
  <text x="310" y="182" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" fill-opacity="0.6">(closed triad / quad)</text>

  <!-- Open relationships: broad umbrella, moderate range -->
  <ellipse cx="460" cy="200" rx="82" ry="48" fill="#818cf8" fill-opacity="0.11"/>
  <ellipse cx="460" cy="200" rx="54" ry="30" fill="#818cf8" fill-opacity="0.09"/>
  <text x="460" y="194" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Open</text>
  <text x="460" y="212" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="600">relationships</text>

  <!-- Swinging: moderately open + couple-intertwined -->
  <ellipse cx="400" cy="300" rx="65" ry="40" fill="#818cf8" fill-opacity="0.14"/>
  <ellipse cx="400" cy="300" rx="42" ry="25" fill="#818cf8" fill-opacity="0.12"/>
  <text x="400" y="304" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Swinging</text>

  <!-- Solo poly: open + deliberately independent -->
  <ellipse cx="560" cy="440" rx="68" ry="42" fill="#818cf8" fill-opacity="0.14"/>
  <ellipse cx="560" cy="440" rx="44" ry="27" fill="#818cf8" fill-opacity="0.12"/>
  <text x="560" y="444" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Solo poly</text>

  <!-- Relationship anarchy: most open + most independent -->
  <ellipse cx="680" cy="505" rx="50" ry="36" fill="#818cf8" fill-opacity="0.14"/>
  <ellipse cx="680" cy="505" rx="32" ry="23" fill="#818cf8" fill-opacity="0.12"/>
  <text x="680" y="499" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Relationship</text>
  <text x="680" y="515" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="13" font-weight="600">anarchy</text>

</svg>