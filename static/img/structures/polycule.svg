<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <defs>
    <radialGradient id="glow-p" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- connections — a small network: triad on left, vee branching right -->
  <!-- triad: A-B-C -->
  <line x1="60" y1="50" x2="100" y2="130" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="60" y1="50" x2="140" y2="50" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="140" y1="50" x2="100" y2="130" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- B connects to D (vee branch) -->
  <line x1="140" y1="50" x2="210" y2="100" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- D connects to E -->
  <line x1="210" y1="100" x2="250" y2="160" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- D connects to F -->
  <line x1="210" y1="100" x2="260" y2="40" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- glow -->
  <circle cx="60" cy="50" r="20" fill="url(#glow-p)"/>
  <circle cx="140" cy="50" r="20" fill="url(#glow-p)"/>
  <circle cx="100" cy="130" r="20" fill="url(#glow-p)"/>
  <circle cx="210" cy="100" r="20" fill="url(#glow-p)"/>
  <circle cx="250" cy="160" r="20" fill="url(#glow-p)"/>
  <circle cx="260" cy="40" r="20" fill="url(#glow-p)"/>
  <!-- nodes -->
  <circle cx="60" cy="50" r="8" fill="#818cf8" fill-opacity="0.8"/>
  <circle cx="140" cy="50" r="8" fill="#818cf8" fill-opacity="0.8"/>
  <circle cx="100" cy="130" r="8" fill="#818cf8" fill-opacity="0.8"/>
  <circle cx="210" cy="100" r="8" fill="#818cf8" fill-opacity="0.8"/>
  <circle cx="250" cy="160" r="8" fill="#818cf8" fill-opacity="0.8"/>
  <circle cx="260" cy="40" r="8" fill="#818cf8" fill-opacity="0.8"/>
</svg>