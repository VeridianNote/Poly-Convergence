name: Strip EXIF Data

on:
  push:
    branches: [main]
    paths:
      - 'static/img/**'
  pull_request:
    paths:
      - 'static/img/**'

permissions:
  contents: write

jobs:
  strip-exif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Strip EXIF data from images
        run: |
          # Only process images that were added or modified (not all images in the repo)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD \
              -- 'static/img/' | grep -iE '\.(jpg|jpeg|png|webp|tiff|gif)$' || true)
          else
            IMAGES=$(git diff --name-only --diff-filter=ACM HEAD~1 \
              -- 'static/img/' | grep -iE '\.(jpg|jpeg|png|webp|tiff|gif)$' || true)
          fi

          if [ -z "$IMAGES" ]; then
            echo "No images found to process."
            exit 0
          fi

          echo "Stripping EXIF data from images..."
          echo "$IMAGES" | while read -r img; do
            echo "  Processing: $img"
            exiftool -all= -overwrite_original "$img"
          done

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit cleaned images
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/img/
          git commit -m "Strip EXIF data from images (automated)"
          git push
